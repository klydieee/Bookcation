<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6FB" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bookcation | Flights, food, and catering on one trip plan</title>
    <meta
      name="description"
      content="Bookcation puts flights, restaurant reservations, and catering on one trip plan. Fork it, compare versions, and book everything in one checkout."
    />
    <script>
      // Set theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem("bookcation.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
